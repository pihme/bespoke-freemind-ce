name: Fuzz Testing

on:
  schedule:
    - cron: '0 4 * * 3'  # Wednesday 4am UTC
  workflow_dispatch:

permissions: {}

env:
  JAVA_VERSION: '21'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jqwik
            timeout: 10
            tests: "tests.freemind.property.*,tests.freemind.unicode.UnicodePropertyTests"
            jazzer: "false"
          - name: jazzer
            timeout: 30
            tests: "tests.freemind.fuzz.*"
            jazzer: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run fuzz tests
        env:
          FUZZ_TESTS: ${{ matrix.tests }}
          JAZZER_FUZZ: ${{ matrix.jazzer }}
        run: |
          args=()
          if [ "$JAZZER_FUZZ" = "true" ]; then
            args+=(-Djazzer.fuzz=true)
          fi
          IFS=',' read -ra patterns <<< "$FUZZ_TESTS"
          for pattern in "${patterns[@]}"; do
            args+=(--tests "$pattern")
          done
          mkdir -p freemind/build/reports
          /usr/bin/time -v -o freemind/build/reports/fuzz-time.txt \
            ./gradlew :freemind:testFuzz --no-daemon --no-configuration-cache --max-workers=2 \
            "${args[@]}"

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            freemind/build/reports/fuzz-time.txt
            freemind/build/test-results/testFuzz/
            crash-*
            **/crash-*
          retention-days: 14
