name: Build

on:
  push:
    branches:
      - 1-raw
      - 2-covered
      - 3-tailored
      - 4-customized
      - 5-trimmed
      - 6-bespoke
  pull_request:
    branches:
      - 1-raw
      - 2-covered
      - 3-tailored
      - 4-customized
      - 5-trimmed
      - 6-bespoke

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (ubuntu-24.04, Java 21)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: env -u JAVA_HOME nix develop -c ./gradlew assemble --no-daemon --no-configuration-cache

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-ubuntu-24.04
          path: |
            build/libs/*.jar
            build/distributions/*
          retention-days: 14
          if-no-files-found: warn

  test:
    name: Test (ubuntu-24.04, Java 21)
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: env -u JAVA_HOME nix develop -c xvfb-run ./gradlew test --no-daemon --no-configuration-cache --continue

      - name: Test count
        if: always()
        run: |
          MIN_TESTS=800
          RESULTS_DIR="build/test-results/test"
          if [ ! -d "$RESULTS_DIR" ]; then
            echo "::warning::No test results directory found — skipping count check"
            exit 0
          fi
          ACTUAL=$(grep -r '<testcase ' "$RESULTS_DIR"/*.xml 2>/dev/null | wc -l | tr -d ' ')
          echo "Test count: $ACTUAL (minimum: $MIN_TESTS)"
          if [ "$ACTUAL" -lt "$MIN_TESTS" ]; then
            echo "::error::Test count regression! Found $ACTUAL tests, expected >= $MIN_TESTS"
            exit 1
          fi
          echo "Test count OK: $ACTUAL >= $MIN_TESTS"

      - name: Publish unit test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v2
        if: always()
        with:
          name: Unit Tests (ubuntu-24.04, Java 21)
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: GUI tests
        run: env -u JAVA_HOME nix develop -c xvfb-run ./gradlew testGui --no-daemon --no-configuration-cache --continue

      - name: E2E showcase screenshots
        run: env -u JAVA_HOME nix develop -c xvfb-run ./gradlew showcaseScreenshots --no-daemon --no-configuration-cache || true
        timeout-minutes: 5

      - name: Upload GUI test screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-test-screenshots-ubuntu-24.04-java21
          path: build/test-screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Screenshot summary
        if: always()
        run: |
          {
            echo "## Screenshots: ubuntu-24.04 / Java 21"
            echo ""

            SHOWCASE_DIR="build/test-screenshots/showcase"
            if [ -d "$SHOWCASE_DIR" ]; then
              WINDOW_COUNT=$(find "$SHOWCASE_DIR" -name "window_*.jpg" -type f | wc -l | tr -d ' ')
              DESKTOP_COUNT=$(find "$SHOWCASE_DIR" -name "desktop_*.png" -type f | wc -l | tr -d ' ')
              echo "### E2E Showcase"
              echo "| Type | Count |"
              echo "|------|-------|"
              echo "| Window screenshots (JPEG) | $WINDOW_COUNT |"
              echo "| Desktop screenshots (PNG) | $DESKTOP_COUNT |"
              echo ""
              echo "Showcase files opened:"
              for IMG in $(find "$SHOWCASE_DIR" -name "window_*.jpg" -type f | sort); do
                NAME=$(basename "$IMG" .jpg | sed 's/window_showcase_//')
                SIZE=$(( $(wc -c < "$IMG") / 1024 ))
                echo "- **$NAME** (${SIZE} KB)"
              done
              echo ""
            fi

            SCREENSHOT_DIR="build/test-screenshots"
            if [ -d "$SCREENSHOT_DIR" ]; then
              TEST_COUNT=$(find "$SCREENSHOT_DIR" -name "*.png" -type f -not -path "*/showcase/*" | wc -l | tr -d ' ')
              if [ "$TEST_COUNT" -gt 0 ]; then
                echo "### GUI Test Screenshots"
                echo "**$TEST_COUNT** test screenshots captured across all test classes."
                echo ""
              fi
            fi

            echo "> Download the **gui-test-screenshots** artifact to view all images."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GUI test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v2
        if: always()
        with:
          name: GUI Tests (ubuntu-24.04, Java 21)
          path: build/test-results/testGui/*.xml
          reporter: java-junit
          fail-on-empty: false

  quality:
    name: Quality control
    needs: test
    runs-on: ubuntu-24.04
    env:
      # Dependabot and fork pull requests have no access to this secret.
      RUN_SONAR: ${{ secrets.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Nix
        if: env.RUN_SONAR == 'true'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Make gradlew executable
        if: env.RUN_SONAR == 'true'
        run: chmod +x ./gradlew

      - name: Compile for analysis
        if: env.RUN_SONAR == 'true'
        run: env -u JAVA_HOME nix develop -c ./gradlew classes testClasses --no-daemon --no-configuration-cache

      - name: SonarQube Cloud scan
        if: env.RUN_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Cloud is not configured for this run
        if: env.RUN_SONAR != 'true'
        run: echo "SonarQube Cloud scan skipped. SONAR_TOKEN is not available for this run."

  release:
    name: Release
    needs: [build, test, quality]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/6-bespoke' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-ubuntu-24.04
          path: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find release -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::The build produced no files to release"
            exit 1
          fi
          TAG=release/6-bespoke
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "6-bespoke" \
            --notes "Built from 6-bespoke at ${GITHUB_SHA}." \
            --latest

  ci:
    name: CI
    if: always()
    needs: [build, test, quality, release]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Evaluate results
        run: |
          echo "Build: ${{ needs.build.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Quality control: ${{ needs.quality.result }}"
          echo "Release: ${{ needs.release.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more jobs were cancelled"
            exit 1
          fi
          echo "All checks passed"
