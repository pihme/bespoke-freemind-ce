name: Build

on:
  push:
    branches:
      - 1-raw
      - 2-covered
      - 3-tailored
      - 4-customized
      - 5-trimmed
      - 6-bespoke
  pull_request:
    branches:
      - 1-raw
      - 2-covered
      - 3-tailored
      - 4-customized
      - 5-trimmed
      - 6-bespoke

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (ubuntu-24.04, Java 21)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x test --no-daemon --no-configuration-cache

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Test
        run: xvfb-run ./gradlew test --no-daemon --no-configuration-cache --continue

      - name: Test Count Regression Guard
        if: always()
        run: |
          MIN_TESTS=800
          RESULTS_DIR="build/test-results/test"
          if [ ! -d "$RESULTS_DIR" ]; then
            echo "::warning::No test results directory found — skipping count check"
            exit 0
          fi
          ACTUAL=$(grep -r '<testcase ' "$RESULTS_DIR"/*.xml 2>/dev/null | wc -l | tr -d ' ')
          echo "Test count: $ACTUAL (minimum: $MIN_TESTS)"
          if [ "$ACTUAL" -lt "$MIN_TESTS" ]; then
            echo "::error::Test count regression! Found $ACTUAL tests, expected >= $MIN_TESTS"
            exit 1
          fi
          echo "Test count OK: $ACTUAL >= $MIN_TESTS"

      - name: Publish Unit Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v2
        if: always()
        with:
          name: Unit Tests (ubuntu-24.04, Java 21)
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload SpotBugs Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spotbugs-report-ubuntu-24.04-java21
          path: build/reports/spotbugs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Generate Coverage Report
        if: always()
        run: xvfb-run ./gradlew jacocoTestReport --no-daemon --no-configuration-cache -x test

      - name: Enforce Coverage Threshold
        if: always()
        run: xvfb-run ./gradlew jacocoTestCoverageVerification --no-daemon --no-configuration-cache -x test

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: build/reports/jacoco/
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-ubuntu-24.04
          path: |
            build/libs/*.jar
            build/distributions/*
          retention-days: 14
          if-no-files-found: warn

  gui-tests:
    name: GUI Tests (ubuntu-24.04, Java 21)
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x test --no-daemon --no-configuration-cache

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: GUI Tests
        run: xvfb-run ./gradlew testGui --no-daemon --no-configuration-cache --continue

      - name: E2E Showcase Screenshots
        run: xvfb-run ./gradlew showcaseScreenshots --no-daemon --no-configuration-cache || true
        timeout-minutes: 5

      - name: Upload GUI Test Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-test-screenshots-ubuntu-24.04-java21
          path: build/test-screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Screenshot Summary
        if: always()
        run: |
          {
            echo "## Screenshots: ubuntu-24.04 / Java 21"
            echo ""

            SHOWCASE_DIR="build/test-screenshots/showcase"
            if [ -d "$SHOWCASE_DIR" ]; then
              WINDOW_COUNT=$(find "$SHOWCASE_DIR" -name "window_*.jpg" -type f | wc -l | tr -d ' ')
              DESKTOP_COUNT=$(find "$SHOWCASE_DIR" -name "desktop_*.png" -type f | wc -l | tr -d ' ')
              echo "### E2E Showcase"
              echo "| Type | Count |"
              echo "|------|-------|"
              echo "| Window screenshots (JPEG) | $WINDOW_COUNT |"
              echo "| Desktop screenshots (PNG) | $DESKTOP_COUNT |"
              echo ""
              echo "Showcase files opened:"
              for IMG in $(find "$SHOWCASE_DIR" -name "window_*.jpg" -type f | sort); do
                NAME=$(basename "$IMG" .jpg | sed 's/window_showcase_//')
                SIZE=$(( $(wc -c < "$IMG") / 1024 ))
                echo "- **$NAME** (${SIZE} KB)"
              done
              echo ""
            fi

            SCREENSHOT_DIR="build/test-screenshots"
            if [ -d "$SCREENSHOT_DIR" ]; then
              TEST_COUNT=$(find "$SCREENSHOT_DIR" -name "*.png" -type f -not -path "*/showcase/*" | wc -l | tr -d ' ')
              if [ "$TEST_COUNT" -gt 0 ]; then
                echo "### GUI Test Screenshots"
                echo "**$TEST_COUNT** test screenshots captured across all test classes."
                echo ""
              fi
            fi

            echo "> Download the **gui-test-screenshots** artifact to view all images."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GUI Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v2
        if: always()
        with:
          name: GUI Tests (ubuntu-24.04, Java 21)
          path: build/test-results/testGui/*.xml
          reporter: java-junit
          fail-on-empty: false

  ci:
    name: CI
    if: always()
    needs: [build, gui-tests, release]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Evaluate results
        run: |
          echo "Build: ${{ needs.build.result }}"
          echo "GUI Tests: ${{ needs.gui-tests.result }}"
          echo "Release: ${{ needs.release.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more jobs were cancelled"
            exit 1
          fi
          echo "All checks passed"

  release:
    name: Release
    needs: [build, gui-tests]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/6-bespoke' &&
      needs.build.result == 'success' &&
      needs.gui-tests.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-ubuntu-24.04
          path: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find release -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::The build produced no files to release"
            exit 1
          fi
          TAG=release/6-bespoke
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "6-bespoke" \
            --notes "Built from 6-bespoke at ${GITHUB_SHA}." \
            --latest
