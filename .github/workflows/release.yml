name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.2.0) — only needed for manual runs'
        required: false

permissions: {}

env:
  JAVA_VERSION: '21'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate 1: build and unit tests on Ubuntu 24.04, Java 21
  validate:
    name: Validate (ubuntu-24.04, Java 21)
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Build + Test
        run: |
          ./gradlew build -x test --no-daemon --no-configuration-cache
          xvfb-run ./gradlew test --no-daemon --no-configuration-cache

  # Gate 2: GUI tests on Ubuntu 24.04, Java 21
  gui-tests:
    name: GUI Tests (ubuntu-24.04, Java 21)
    permissions:
      contents: read
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x test --no-daemon --no-configuration-cache

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: GUI Tests
        run: xvfb-run ./gradlew testGui --no-daemon --no-configuration-cache --continue

      - name: E2E Showcase Screenshots
        run: xvfb-run ./gradlew showcaseScreenshots --no-daemon --no-configuration-cache || true
        timeout-minutes: 5

      - name: Upload GUI Test Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gui-screenshots-ubuntu-24.04-java21
          path: build/test-screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Screenshot Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Screenshots: ubuntu-24.04 / Java 21"
            echo ""

            # Showcase screenshots
            SHOWCASE_DIR="build/test-screenshots/showcase"
            if [ -d "$SHOWCASE_DIR" ]; then
              WINDOW_COUNT=$(find "$SHOWCASE_DIR" -name "window_*.jpg" -type f | wc -l | tr -d ' ')
              DESKTOP_COUNT=$(find "$SHOWCASE_DIR" -name "desktop_*.png" -type f | wc -l | tr -d ' ')
              echo "### E2E Showcase"
              echo "| Type | Count |"
              echo "|------|-------|"
              echo "| Window screenshots (JPEG) | $WINDOW_COUNT |"
              echo "| Desktop screenshots (PNG) | $DESKTOP_COUNT |"
              echo ""
              echo "Showcase files opened:"
              for IMG in $(find "$SHOWCASE_DIR" -name "window_*.jpg" -type f | sort); do
                NAME=$(basename "$IMG" .jpg | sed 's/window_showcase_//')
                SIZE=$(( $(wc -c < "$IMG") / 1024 ))
                echo "- **$NAME** (${SIZE} KB)"
              done
              echo ""
            fi

            # Test screenshots
            SCREENSHOT_DIR="build/test-screenshots"
            if [ -d "$SCREENSHOT_DIR" ]; then
              TEST_COUNT=$(find "$SCREENSHOT_DIR" -name "*.png" -type f -not -path "*/showcase/*" | wc -l | tr -d ' ')
              if [ "$TEST_COUNT" -gt 0 ]; then
                echo "### GUI Test Screenshots"
                echo "**$TEST_COUNT** test screenshots captured across all test classes."
                echo ""
              fi
            fi

            echo "> Download the **release-gui-screenshots** artifact to view all images."
          } >> "$GITHUB_STEP_SUMMARY"

  # Packaging — only runs after ALL validate + GUI tests pass
  build-macos:
    name: Package (macOS)
    permissions:
      contents: read
    needs: [validate, gui-tests]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x test --no-daemon --no-configuration-cache

      - name: Package DMG
        run: ./gradlew jpackageMac --no-daemon --no-configuration-cache

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/jpackage
          for f in *.dmg; do [ -f "$f" ] && mv "$f" "FreeMind-CE-${VERSION}-macOS.dmg"; done

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FreeMindCE-macOS
          path: build/jpackage/FreeMind-CE-*
          if-no-files-found: error

  build-windows:
    name: Package (Windows)
    permissions:
      contents: read
    needs: [validate, gui-tests]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build
        shell: bash
        run: ./gradlew build -x test --no-daemon --no-configuration-cache

      - name: Package EXE
        shell: bash
        run: ./gradlew jpackageWin --no-daemon --no-configuration-cache

      - name: Package MSI
        shell: bash
        run: ./gradlew jpackageWinMsi --no-daemon --no-configuration-cache

      - name: Create portable archive (ZIP for Windows)
        shell: bash
        run: |
          ./gradlew installDist --no-daemon --no-configuration-cache
          VERSION="${GITHUB_REF_NAME#v}"

          # Bundle doc/ at root level for portable (getFreemindBaseDir strips "lib")
          cp -r src/main/resources/doc build/install/freemind/doc
          # Remove jpackage-specific lib/doc/ to avoid double-bundling
          rm -rf build/install/freemind/lib/doc
          ls build/install/freemind/doc/freemind.mm || { echo "ERROR: doc/freemind.mm not found"; exit 1; }

          cd build/install
          powershell -Command "Compress-Archive -Path 'freemind\*' -DestinationPath '..\jpackage\FreeMind-CE-${VERSION}-Windows-portable.zip'"

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/jpackage
          for f in *.exe; do [ -f "$f" ] && mv "$f" "FreeMind-CE-${VERSION}-Windows.exe"; done
          for f in *.msi; do [ -f "$f" ] && mv "$f" "FreeMind-CE-${VERSION}-Windows.msi"; done

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FreeMindCE-Windows
          path: build/jpackage/FreeMind-CE-*
          if-no-files-found: error

  build-linux:
    name: Package (Linux)
    permissions:
      contents: read
    needs: [validate, gui-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Build
        run: ./gradlew build -x test --no-daemon --no-configuration-cache

      - name: Package DEB
        run: ./gradlew jpackageLinux --no-daemon --no-configuration-cache

      - name: Package RPM
        run: ./gradlew jpackageLinuxRpm --no-daemon --no-configuration-cache

      - name: Create portable archive (tar.gz for Linux)
        run: |
          ./gradlew installDist --no-daemon --no-configuration-cache
          VERSION="${GITHUB_REF_NAME#v}"
          # Bundle doc/ at root level for portable (getFreemindBaseDir strips "lib")
          cp -r src/main/resources/doc build/install/freemind/doc
          # Remove jpackage-specific lib/doc/ to avoid double-bundling
          rm -rf build/install/freemind/lib/doc
          ls build/install/freemind/doc/freemind.mm || { echo "ERROR: doc/freemind.mm not found"; exit 1; }
          cd build/install
          tar -czf "../jpackage/FreeMind-CE-${VERSION}-portable.tar.gz" freemind/

      - name: Build AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Download appimagetool with checksum verification
          EXPECTED_SHA="b72d338a9a4969815a935b230512519990b5ed729821f1b27480e15d0ca64e36"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          ACTUAL_SHA=$(sha256sum appimagetool | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::appimagetool checksum mismatch! Expected: $EXPECTED_SHA, Got: $ACTUAL_SHA"
            exit 1
          fi
          chmod +x appimagetool

          # Create AppDir structure from installed dist
          APPDIR="FreeMind-CE.AppDir"
          mkdir -p "${APPDIR}/usr/bin" "${APPDIR}/usr/lib" "${APPDIR}/usr/share/icons/hicolor/256x256/apps"

          # Copy application files
          cp -r build/install/freemind/lib/* "${APPDIR}/usr/lib/"

          # Create launcher script
          cat > "${APPDIR}/usr/bin/freemind-ce" << 'LAUNCHER'
          #!/bin/bash
          APPDIR="$(dirname "$(dirname "$(readlink -f "$0")")")"
          exec java -Xms64m -Xmx512m -cp "${APPDIR}/lib/*" freemind.main.FreeMindStarter "$@"
          LAUNCHER
          chmod +x "${APPDIR}/usr/bin/freemind-ce"

          # Copy desktop file and icon
          cp appimage/freemind-ce.desktop "${APPDIR}/"
          cp src/main/resources/images/FreeMindWindowIcon.png "${APPDIR}/freemind-ce.png"
          cp src/main/resources/images/FreeMindWindowIcon.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/freemind-ce.png"

          # Create AppRun
          cat > "${APPDIR}/AppRun" << 'APPRUN'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          exec "${APPDIR}/usr/bin/freemind-ce" "$@"
          APPRUN
          chmod +x "${APPDIR}/AppRun"

          # Build AppImage
          ARCH=x86_64 ./appimagetool "${APPDIR}" "build/jpackage/FreeMind-CE-${VERSION}-Linux-x86_64.AppImage"

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/jpackage
          for f in *.deb; do [ -f "$f" ] && mv "$f" "FreeMind-CE-${VERSION}-Linux.deb"; done
          for f in *.rpm; do [ -f "$f" ] && mv "$f" "FreeMind-CE-${VERSION}-Linux.rpm"; done

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FreeMindCE-Linux
          path: build/jpackage/FreeMind-CE-*
          if-no-files-found: error

      - name: Upload JAR distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FreeMindCE-jar
          path: build/distributions/*

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Generate checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate SBOM
        run: |
          ./gradlew cyclonedxBom --no-daemon --no-configuration-cache
          mkdir -p artifacts/sbom
          cp build/reports/bom.json artifacts/sbom/bom.json
          cp build/reports/bom.xml artifacts/sbom/bom.xml

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6107eb3a806d6a4a2688cc4b9842945a27f5d # v3.9.0

      - name: Sign release artifacts
        run: |
          cd artifacts
          for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS.txt" ] && [ "$f" != "SHA256SUMS.txt.sig" ] && [ "$f" != "SHA256SUMS.txt.pem" ]; then
              cosign sign-blob --yes "$f" --output-signature="${f}.sig" --output-certificate="${f}.pem"
              echo "Signed: $f"
            fi
          done
          # Also sign the checksums file
          cosign sign-blob --yes SHA256SUMS.txt --output-signature=SHA256SUMS.txt.sig --output-certificate=SHA256SUMS.txt.pem

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            artifacts/FreeMind-CE-*
            artifacts/SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
