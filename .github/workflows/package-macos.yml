name: Package macOS

on:
  push:
    branches:
      - package/macos

permissions:
  contents: read

jobs:
  dmg:
    name: macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the disk image
        run: ./gradlew jpackageMac --no-daemon --no-configuration-cache

      - name: Name the image with the architecture
        run: |
          arch=$(uname -m)
          src=$(echo build/jpackage/*.dmg)
          cp "$src" "build/jpackage/FreeMind-CE-1.3.4-macos-${arch}.dmg"

      - name: Upload the disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freemind-ce-macos
          path: build/jpackage/FreeMind-CE-1.3.4-macos-*.dmg
          if-no-files-found: error
