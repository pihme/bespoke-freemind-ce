version: 2
updates:
  # One entry per stage branch. Dependabot reads this file from the
  # default branch and opens each pull request against target-branch.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "1-raw"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "1-raw"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "java"
    groups:
      testing:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
          - "net.jqwik*"
      logging:
        patterns:
          - "org.slf4j*"
          - "ch.qos.logback*"
      apache:
        patterns:
          - "org.apache.xmlgraphics*"
          - "org.apache.batik*"

