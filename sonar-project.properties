# SonarQube Cloud analysis, run from the Quality control job.
sonar.organization=pihme
sonar.projectKey=pihme_bespoke-freemind-ce
sonar.projectName=bespoke-freemind-ce

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
# Filled by ./gradlew sonarLibraries before the scan.
sonar.java.libraries=build/sonar-libraries/main/*.jar
sonar.java.test.libraries=build/sonar-libraries/test/*.jar
